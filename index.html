<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邕城余生 · 南宁丧尸搜打撤</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- 局内 HUD -->
<div id="hud" class="hidden">
  <div id="hud-top">
    <div id="hud-timer">撤离窗口 15:00</div>
    <div id="hud-zone">朝阳广场</div>
    <div id="hud-mods"></div>
  </div>
  <div id="hud-left">
    <div class="bar"><span class="lbl">生命</span><div class="track"><div id="b-hp" class="fill hp"></div></div><span id="t-hp" class="num"></span></div>
    <div class="bar"><span class="lbl">体力</span><div class="track"><div id="b-st" class="fill st"></div></div></div>
    <div class="bar"><span class="lbl">饥饿</span><div class="track"><div id="b-hu" class="fill hu"></div></div></div>
    <div class="bar"><span class="lbl">感染</span><div class="track"><div id="b-in" class="fill inf"></div></div><span id="t-in" class="num"></span></div>
    <div id="hud-status"></div>
  </div>
  <div id="hud-weapon">
    <div id="w-name"></div>
    <div id="w-ammo"></div>
    <div id="w-slots"></div>
    <div id="w-throw"></div>
  </div>
  <div id="hud-xp"><div id="b-xp"></div><span id="t-lv"></span></div>
  <div id="hud-extract"></div>
  <div id="hud-log"></div>
  <div id="hud-prompt"></div>
  <div id="hud-progress" class="hidden"><div id="prog-fill"></div><span id="prog-text"></span></div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="hud-help">WASD 走位 · 左键 攻击 · 右键 翻滚 · 滚轮 换武器 · 停下自动搜刮</div>
  <div id="hud-btns"><span class="hbtn" id="hb-inv">背包</span><span class="hbtn" id="hb-map">地图</span><span class="hbtn" id="hb-pause">暂停</span></div>
</div>

<!-- 通用面板 -->
<div id="screen" class="hidden"></div>
<div id="toast"></div>

<script src="data/map.js"></script>
<script src="data/outlines.js"></script>
<script src="js/util.js"></script>
<script src="js/assets.js"></script>
<script src="js/rig.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/map.js"></script>
<script src="js/city.js"></script>
<script src="js/render.js"></script>
<script src="js/entities.js"></script>
<script src="js/raid.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
